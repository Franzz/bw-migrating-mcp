; Template for credentials.ini: copy it and fill in your values.
; Keep both files in the parent BW migration project, next to start-bw-mcp.mjs.
; credentials.ini is read by start-bw-mcp.mjs and must not be shared (it is git-ignored).

[sap]
; SAP user (leave empty to use the user of the Eclipse project)
user =
; SAP password (or set BW_PASSWORD in the environment)
password =
