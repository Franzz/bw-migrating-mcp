<VirtualHost 127.0.0.1:80 [::1]:80>
    ServerName bw-audit.localhost

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 600
    ProxyPass / http://127.0.0.1:5180/ connectiontimeout=5 timeout=600
    ProxyPassReverse / http://127.0.0.1:5180/

    # Keep streamed audit progress and chat responses uncompressed.
    SetEnv no-gzip 1

    <Location />
        Require local
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/bw-migration-error.log
    CustomLog ${APACHE_LOG_DIR}/bw-migration-access.log combined
</VirtualHost>
